<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Георгий & Лолита | 12.09.2026</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300&display=swap');


*{
box-sizing:border-box;
}


body{
margin:0;
background:#f8f4ee;
color:#2d2b29;
font-family:'Cormorant Garamond', serif;
}


/* ПЕРВЫЙ ЭКРАН */

.hero{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
rgba(250,245,238,.35),
rgba(250,245,238,.65)
),
url("IMG_0605.JPG");

background-size:cover;
background-position:center;

}


.envelope{

width:330px;
height:220px;

background:#fffaf3;

position:relative;

display:flex;
justify-content:center;
align-items:center;

cursor:pointer;

box-shadow:
0 20px 50px rgba(0,0,0,.15);

border:1px solid rgba(150,120,90,.3);

transition:.8s;

}


.envelope:before{

content:"";

position:absolute;

top:0;
left:0;

border-left:165px solid transparent;
border-right:165px solid transparent;
border-top:110px solid #eee2d3;

transform-origin:top;

transition:.8s;

}


.envelope.open:before{

transform:rotateX(180deg);

}


.envelope-text{

position:relative;
z-index:2;

text-align:center;

}


.names{

font-size:45px;

letter-spacing:8px;

font-weight:300;

}


.date{

font-family:'Montserrat',sans-serif;

font-size:13px;

letter-spacing:5px;

margin-top:20px;

}


.click{

margin-top:25px;

font-family:'Montserrat',sans-serif;

font-size:11px;

letter-spacing:3px;

}


.hidden{

display:none;

}


</style>

</head>


<body>


<section class="hero">


<div class="envelope" onclick="openInvite()">


<div class="envelope-text">

<div class="names">
ГЕОРГИЙ
<br>
&
<br>
ЛОЛИТА
</div>


<div class="date">
12 • 09 • 2026
</div>


<div class="click">
ОТКРЫТЬ ПРИГЛАШЕНИЕ
</div>


</div>


</div>


</section>


<script>

function openInvite(){

document.querySelector(".envelope")
.classList.add("open");


setTimeout(()=>{

alert("Приглашение открыто 🤍");

},800);

}

</script>


</body>

</html>
