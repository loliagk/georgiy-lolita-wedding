<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Георгий & Лолита | 12.09.2026</title>
.music-btn{
position:fixed;
bottom:25px;
right:25px;

padding:12px 25px;

background:rgba(255,255,255,0.75);
border:1px solid #555;

font-size:12px;
letter-spacing:2px;

z-index:10;
}
<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
background:#faf7f2;
color:#2c2c2c;
}

.hero{
height:100vh;
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-align:center;

background:
linear-gradient(
rgba(255,255,255,0.35),
rgba(250,247,242,0.65)
),
url("IMG_0605.JPG");

background-size:cover;
background-position:center;
}

.hero:before{
content:"";
position:absolute;
inset:25px;
border:1px solid rgba(255,255,255,0.7);
}

.content{
position:relative;
animation:show 2s ease;
}

.names{
font-family:'Cormorant Garamond',serif;
font-size:75px;
font-weight:300;
letter-spacing:12px;
line-height:1;
}

.and{
font-size:35px;
margin:20px;
font-family:'Cormorant Garamond',serif;
}

.date{
margin-top:35px;
font-family:'Montserrat',sans-serif;
font-size:16px;
letter-spacing:8px;
}

.text{
margin-top:35px;
font-family:'Montserrat',sans-serif;
font-size:14px;
line-height:2;
letter-spacing:2px;
}

button{
margin-top:45px;
padding:15px 45px;
background:transparent;
border:1px solid #444;
font-family:'Montserrat',sans-serif;
letter-spacing:2px;
cursor:pointer;
transition:.4s;
}

button:hover{
background:#2c2c2c;
color:white;
}

@keyframes show{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}


@media(max-width:600px){

.names{
font-size:45px;
letter-spacing:7px;
}

}

</style>

</head>


<body>


<section class="hero">

<div class="content">

<div class="names">
ГЕОРГИЙ
</div>

<div class="and">
&
</div>

<div class="names">
ЛОЛИТА
</div>


<div class="date">
12 • 09 • 2026
</div>


<div class="text">
ПРИГЛАШАЕМ ВАС<br>
РАЗДЕЛИТЬ С НАМИ<br>
САМЫЙ ВАЖНЫЙ ДЕНЬ
</div>


<button>
ОТКРЫТЬ ПРИГЛАШЕНИЕ
</button>


</div>

</section>


<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="playMusic()">
♫ Включить музыку
</button>


<script>
function playMusic(){
let music = document.getElementById("music");

if(music.paused){
music.play();
document.querySelector(".music-btn").innerHTML="♫ Музыка играет";
}
else{
music.pause();
document.querySelector(".music-btn").innerHTML="♫ Включить музыку";
}
}
</script>
</html>
