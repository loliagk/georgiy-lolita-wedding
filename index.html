<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Георгий & Лолита | 12.09.2026</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300&display=swap');


*{
box-sizing:border-box;
}


body{
margin:0;
background:#faf7f2;
color:#2d2b29;
font-family:'Cormorant Garamond',serif;
}


.hero{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
rgba(250,245,238,.35),
rgba(250,245,238,.75)
),
url("IMG_0605.JPG");

background-size:cover;
background-position:center;

}


.envelope{

width:330px;
height:230px;

background:#fffaf3;

display:flex;
justify-content:center;
align-items:center;

position:relative;

cursor:pointer;

box-shadow:0 20px 50px rgba(0,0,0,.15);

border:1px solid #dfd0bd;

transition:1s;

}


.envelope:before{

content:"";

position:absolute;

top:0;
left:0;

border-left:165px solid transparent;
border-right:165px solid transparent;
border-top:115px solid #eee1d1;

transform-origin:top;

transition:1s;

}


.envelope.open:before{

transform:rotateX(180deg);

}


.envelope-content{

position:relative;
z-index:2;
text-align:center;

}


.names{

font-size:45px;
letter-spacing:8px;
font-weight:300;

}


.date{

margin-top:20px;

font-family:'Montserrat',sans-serif;

font-size:13px;

letter-spacing:5px;

}


.open-text{

margin-top:25px;

font-family:'Montserrat',sans-serif;

font-size:11px;

letter-spacing:3px;

}


.hidden{

display:none;

}


.invite{

min-height:100vh;

padding:80px 25px;

display:flex;

justify-content:center;

text-align:center;

background:#faf7f2;

animation:fade 1.5s ease;

}


.invite-content{

max-width:650px;

font-size:22px;

line-height:1.8;

}


h1{

font-size:45px;

font-weight:300;

}


h3{

margin-top:55px;

font-family:'Montserrat',sans-serif;

font-size:13px;

letter-spacing:5px;

}


.line{

width:80px;

height:1px;

background:#555;

margin:45px auto;

}


#timer{

font-family:'Montserrat',sans-serif;

font-size:16px;

letter-spacing:2px;

margin:30px 0;

}


.map{

display:inline-block;

padding:15px 35px;

border:1px solid #555;

text-decoration:none;

color:#2d2b29;

font-family:'Montserrat',sans-serif;

font-size:12px;

letter-spacing:3px;

}


@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>


<section class="hero">


<div class="envelope" onclick="openInvite()">


<div class="envelope-content">

<div class="names">
ГЕОРГИЙ
<br>
&
<br>
ЛОЛИТА
</div>


<div class="date">
12 • 09 • 2026
</div>


<div class="open-text">
ОТКРЫТЬ ПРИГЛАШЕНИЕ
</div>


</div>

</div>


</section>
